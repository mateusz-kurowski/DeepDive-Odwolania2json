name: odwolanie
description: >-
  Odwołanie do Prezesa Krajowej Izby Odwoławczej (KIO) wnoszone przez wykonawcę
  w postępowaniu o udzielenie zamówienia publicznego: strony, pełnomocnik, numery
  postępowania i zarzuty. Nie jest nim wyrok ani postanowienie KIO (sygnatura akt,
  „orzeka”), które tylko opisują odwołanie.
hints:
  - odwołanie
  - odwolanie
  - Krajowej Izby Odwoławczej
  - Odwołujący
# Słowa wykluczające (początek dokumentu): wyroki i postanowienia KIO, ogłoszenia TED.
exclude_hints:
  - "orzeka:"
  - po rozpoznaniu na posiedzeniu
  - po rozpoznaniu na rozprawie
  - See the notice on TED
rules:
  - "czynnosc_dzien i czynnosc_powod_id opisują czynność albo zaniechanie zamawiającego zaskarżone odwołaniem (to, którego dotyczy pierwszy zarzut). Szukaj go w tej kolejności: (a) zdanie przed listą zarzutów opisujące zaskarżoną czynność, zwykle „Zamawiający w dniu DATA roku [czynność]” (także w części „wnoszę odwołanie wobec czynności/zaniechania…”); (b) punkt 1) wyliczenia „…polegających na: 1) …”; (c) tytuł „Zarzut nr 1 – …”, jeśli nazywa konkretną czynność (np. „bezpodstawnego odrzucenia oferty”). Uzasadnienie zarzutu (ogólne wywody o OPZ, dokumentacji, zasadach konkurencji) NIE wyznacza kodu ani daty."
  - "czynnosc_dzien to data zaskarżonej czynności (ISO) z tego zdania albo z „o którym Zamawiający zawiadomił pismem z dnia …”. Nie bierz daty pisma odwołania ani dat wcześniejszych zdarzeń („Uprzednio, w dniu …”, „Wcześniej, w dniu …”, otwarcie ofert, wezwanie do wyjaśnień). Gdy brak wiarygodnej daty, zwróć null."
  - "czynnosc_powod_id według sformułowania zaskarżonej czynności: „unieważnił postępowanie” = 9; „odrzucił ofertę”, „poinformował o odrzuceniu oferty” = 1; „wykluczył”, „poinformował o wykluczeniu” = 3; „ogłosił wybór oferty”, „dokonał wyboru oferty” = 2; „opublikował/udostępnił SWZ” (także razem z ogłoszeniem o zamówieniu) = 4; „zmodyfikował treść SWZ” = 5; „udzielił odpowiedzi”, „przekazał odpowiedzi i wyjaśnienia do SWZ” = 6; „nie odrzucił oferty”, „zaniechał odrzucenia” = 7; „nie wykluczył”, „zaniechał wykluczenia” = 8; „zaniechał unieważnienia” = 10; „udostępnił/opublikował Opis Przedmiotu Zamówienia” = 11."
  - "Zaniechanie ma pierwszeństwo przed wyborem oferty: gdy zdanie mówi o informacji o wyniku postępowania lub o wyborze oferty, ale zaskarżone jest zaniechanie („zaniechawszy unieważnienia”, „z której wynika, że zaniechał wykluczenia”, „nie odrzucił oferty”), kod to zaniechanie (10, 8 albo 7), nie 2. Rozstrzyga punkt 1) wyliczenia i tytuł pierwszego zarzutu."
  - "Kod 11 (OPZ) tylko wtedy, gdy zaskarżona czynność to udostępnienie lub opublikowanie opisu przedmiotu zamówienia. Samo omawianie OPZ w treści zarzutu nie oznacza kodu 11."
  - "data i miejscowosc pochodzą z nagłówka pierwszej strony (linia „Miejscowość, dnia DD.MM.RRRR” albo „Miejscowość DD.MM.RRRR”). Gdy nagłówka z miejscowością i datą nie ma, zwróć null."
  - "Odwolujacy: gdy występuje konsorcjum odwołujących, podaj dane Lidera konsorcjum (jeden element tablicy)."
  - "przez-pelnomocnika = 1, gdy odwołujący jest reprezentowany przez pełnomocnika (np. „reprezentowany przez”, „na podstawie pełnomocnictwa”), w przeciwnym razie 0."
  - "pelnomocnik.imie_nazwisko: gdy jest kilku pełnomocników, pierwszy wymieniony. pelnomocnik.nazwa to nazwa podmiotu zatrudniającego pełnomocnika (kancelarii), zwykle z linii „adres do korespondencji: Kancelaria …” albo ze stopki pełnomocnika; nigdy nazwa odwołującego ani zamawiającego (gdy brak takiej nazwy, null), a mail to adres kontaktowy pełnomocnika odwołującego, nie zamawiającego."
  - "Imię i nazwisko pełnomocnika zapisz w mianowniku, także gdy w tekście stoi w innym przypadku (np. „Mateusza Szymańskiego” → „Mateusz Szymański”), bez tytułów (adw., r.pr.) i numerów wpisu."
  - "Zamawiajacy: dane NIP, KRS, REGON podaj tylko jeśli są jawnie przy zamawiającym. Każdy zamawiający to osobny element tablicy."
  - "prowadzacy_postepowanie: null, gdy jest jeden zamawiający lub brak informacji. Gdy zamawiających jest więcej: 1 dla oznaczonego jako prowadzący postępowanie lub lider postępowania, 0 dla pozostałych."
  - "numer_bzp przepisz w całości, tak jak w dokumencie, bez spacji: YYYY/BZP######## razem z końcówką /NN, jeśli występuje (np. 2026/BZP00123456/03 zostaje 2026/BZP00123456/03, nie obcinaj /03). Tylko numer ogłoszenia BZP (nie TED). numer_ted w formacie NNNNNN-YYYY, a zapis „YYYY/S ###-NNNNNN” zamień na NNNNNN-YYYY."
  - "numer_postepowania to numer referencyjny sprawy (np. ZP.039.2025). tytul to tytuł zamówienia bez cudzysłowów."
requires:
  - when: OdwolanieKIO.czynnosc_powod_id
    then: [OdwolanieKIO.czynnosc_dzien]
    message: "Data zaskarżonej czynności stoi zwykle w zdaniu „Zamawiający w dniu DATA roku …” przed pierwszym zarzutem."
